<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Redirecting — Roses Of Rome Pictures</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta http-equiv="refresh" content="0; url=/roses-of-rome/" />
    <script>
      // GitHub Pages SPA fallback: stash the requested path and go to the app root
      try {
        sessionStorage.setItem(
          "ro_redirect",
          "/roses-of-rome" + (location.pathname.replace(/^\/roses-of-rome/, "") || "/") + location.search + location.hash
        );
      } catch (e) {}
      setTimeout(function () {
        window.location.replace("/roses-of-rome/");
      }, 100);
    </script>
  </head>
  <body>
    <p>Redirecting to <a href="/roses-of-rome/">Roses of Rome</a>...</p>
  </body>
</html>
